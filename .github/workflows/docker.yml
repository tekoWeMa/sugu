name: Publish Docker image (sugu)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to the private registry
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      # Without this the action falls back to the docker driver, which builds
      # into the daemon and pushes from there. That produces a manifest this
      # registry rejects with "manifest invalid". The container driver pushes
      # straight out of BuildKit.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the private registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          # Without `registry:` this authenticates against Docker Hub no matter
          # what the tags say, and the push is denied against the wrong host.
          registry: registry.lunareclipse.ch
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@3caf19fbe3db1a1a6a8bdce189e09ac0ed35d513
        with:
          images: registry.lunareclipse.ch/sugu

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: registry.lunareclipse.ch/sugu
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
